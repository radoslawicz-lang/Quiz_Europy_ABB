name: Zbuduj AAB do Google Play

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v6

      - name: Ustaw Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Przygotuj Android SDK 36
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Ustaw Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Odtwórz klucz przesyłania
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/quiz-europy-upload.jks"
          test -s "$RUNNER_TEMP/quiz-europy-upload.jks"

      - name: Zbuduj podpisany AAB release
        shell: bash
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/quiz-europy-upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          gradle --no-daemon --stacktrace clean bundleRelease

      - name: Sprawdź podpis i nazwij pakiet
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB"
          jarsigner -verify -verbose -certs "$AAB" >/dev/null
          keytool -list -keystore "$RUNNER_TEMP/quiz-europy-upload.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          cp "$AAB" "Quiz-Europy-v1.3.3-release.aab"

      - name: Udostępnij AAB
        uses: actions/upload-artifact@v4
        with:
          name: Quiz-Europy-AAB-Google-Play-v1.3.3
          path: Quiz-Europy-v1.3.3-release.aab
          if-no-files-found: error
          retention-days: 30
